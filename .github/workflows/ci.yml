name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install engine dev dependencies
        working-directory: engine
        run: python -m pip install --group dev

      - name: Engine tests
        working-directory: engine
        run: pytest -q

  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Smoke Check
        run: npm run smoke

      - name: Upload Dist
        uses: actions/upload-artifact@v4
        with:
          name: code-visualizer-dist
          path: dist
