<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Code Visualizer Step logo</title>
  <desc id="desc">An execution axis with measured ticks and one illuminated current-step node.</desc>
  <defs>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3.4" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0e1117" />
  <g stroke="#1a212e" stroke-width="1">
    <line x1="0" y1="21.3" x2="64" y2="21.3" />
    <line x1="0" y1="42.6" x2="64" y2="42.6" />
    <line x1="21.3" y1="0" x2="21.3" y2="64" />
    <line x1="42.6" y1="0" x2="42.6" y2="64" />
  </g>
  <line x1="12" y1="36" x2="52" y2="36" stroke="#2f3949" stroke-width="1.6" stroke-linecap="round" />
  <g stroke="#2f3949" stroke-width="1.6" stroke-linecap="round">
    <line x1="16" y1="32.4" x2="16" y2="39.6" />
    <line x1="26" y1="32.4" x2="26" y2="39.6" />
    <line x1="36" y1="32.4" x2="36" y2="39.6" />
    <line x1="46" y1="32.4" x2="46" y2="39.6" />
  </g>
  <line x1="12" y1="36" x2="36" y2="36" stroke="#4f8ef7" stroke-width="1.9" stroke-linecap="round" />
  <circle cx="36" cy="36" r="6" fill="#4f8ef7" filter="url(#glow)" />
  <circle cx="36" cy="36" r="4.6" fill="#4f8ef7" />
  <circle cx="36" cy="36" r="1.9" fill="#d6e4fb" />
</svg>
